<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<title>紫嫈的三年級加油站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
(function () {
  var t = Date.now();
  var css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "style.css?t=" + t;
  document.head.appendChild(css);
  var files = ["data.js", "legacy.js", "gen.js", "gen2.js", "app.js"];
  function load(i) {
    if (i >= files.length) return;
    var s = document.createElement("script");
    s.src = files[i] + "?t=" + t;
    s.onload = function () { load(i + 1); };
    document.body.appendChild(s);
  }
  function start() { load(0); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</head>
<body>
<header class="topbar">
  <button id="homeBtn" class="iconbtn" aria-label="回首頁">🏠</button>
  <h1><span class="title-hl">紫嫈的三年級加油站</span></h1>
  <span class="spacer chick" aria-hidden="true">🐥</span>
</header>
<main id="app" tabindex="-1" aria-live="polite"></main>
<div id="toast" role="status" aria-live="assertive"></div>
</body>
</html>
