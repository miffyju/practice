<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache">
<title>芷媃的五年級加油站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
(function () {
  var t = Date.now();
  var css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "style.css?t=" + t;
  document.head.appendChild(css);
  var files = ["data.js", "archive.js", "extra.js", "olympiad.js", "gen.js", "scratch-save.js", "app.js"];
  function load(i) {
    if (i >= files.length) return;
    var s = document.createElement("script");
    s.src = files[i] + "?t=" + t;
    s.charset = "utf-8";
    s.onload = function () { load(i + 1); };
    document.body.appendChild(s);
  }
  function mountChick() {
    var slot = document.querySelector(".topbar .chick");
    var tpl = document.getElementById("chick-tpl");
    if (slot && tpl && !slot.querySelector("svg")) slot.appendChild(tpl.content.cloneNode(true));
  }
  function start() { mountChick(); load(0); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</head>
<body>
<header class="topbar">
  <button id="homeBtn" class="iconbtn" aria-label="回首頁">🏠</button>
  <h1><span class="title-hl">芷媃的五年級加油站</span></h1>
  <span class="spacer chick" aria-hidden="true"></span>
</header>
<template id="chick-tpl">
<svg class="chick-svg" viewBox="0 0 80 76" overflow="visible" aria-hidden="true" focusable="false">
  <g class="ck-sparks">

    <path class="ck-spark" d="M70 8 L71.4 11.6 L75.2 12.2 L72.2 14.8 L73 18.6 L70 16.6 L67 18.6 L67.8 14.8 L64.8 12.2 L68.6 11.6 Z" fill="#C8EBD8" stroke="#4a3a32" stroke-width="1.1" stroke-linejoin="round"/>
    <path class="ck-spark" d="M18 6 L19 9 L22.2 9.4 L19.8 11.4 L20.4 14.6 L18 12.8 L15.6 14.6 L16.2 11.4 L13.8 9.4 L17 9 Z" fill="#F9D6DC" stroke="#4a3a32" stroke-width="1" stroke-linejoin="round"/>

  </g>
  <ellipse cx="40" cy="71.5" rx="16" ry="3.2" fill="rgba(74,58,50,.16)"/>
  <g class="ck-hop">

      <path d="M40 22 C38.7 15.2 39.3 8.2 41.2 7.6 C43.3 10.8 42.5 16.8 41.3 23.2 Z"/>

    </g>
    <ellipse cx="40" cy="43.5" rx="24" ry="22.6" fill="#FFE056" stroke="#4a3a32" stroke-width="2.6"/>
    <ellipse cx="40" cy="51.5" rx="15" ry="11.5" fill="#FFF6C4"/>
    <g transform="translate(19 51.5)">
      <g class="ck-wing-l">
        <ellipse cx="0" cy="0" rx="6.2" ry="4.4" fill="#F3C43A" stroke="#4a3a32" stroke-width="2.1" transform="rotate(-28)"/>
      </g>
    </g>
    <g class="ck-face">
      <ellipse cx="25.5" cy="47" rx="5.2" ry="3.2" fill="#F7B8C4"/>
      <ellipse cx="54.5" cy="47" rx="5.2" ry="3.2" fill="#F7B8C4"/>
      <circle cx="31" cy="40.2" r="3.35" fill="#4a3a32"/>
      <circle cx="49" cy="40.2" r="3.35" fill="#4a3a32"/>

      <circle cx="50.15" cy="38.9" r="1.15" fill="#fff"/>

      <circle cx="48.35" cy="41.15" r=".45" fill="#fff" opacity=".7"/>

    </g>
    <g class="ck-feet">
      <g transform="translate(30 66.5)">
        <g class="ck-foot-l">
          <path d="M-8 0 C-8 5.6 7 5.6 7 .4 C7 -2.4 -8 -2.4 -8 0Z" fill="#F08A3A" stroke="#4a3a32" stroke-width="2" stroke-linejoin="round"/>
        </g>
      </g>
      <g transform="translate(50 66.5)">
        <g class="ck-foot-r">

        </g>
      </g>
    </g>
    <!-- 右翅與木棍同一組：杆子固定在翅上，只有旗布從杆邊飄動 -->

      <g class="ck-flag">
        <line x1="1.5" y1="-2" x2="-2" y2="-47" stroke="#4a3a32" stroke-width="2.5" stroke-linecap="round"/>

          <g class="ck-cloth-wave">

          </g>
        </g>
      </g>
      <g class="ck-wing-r">
        <ellipse cx="0" cy="0" rx="6.2" ry="4.4" fill="#F3C43A" stroke="#4a3a32" stroke-width="2.1" transform="rotate(28)"/>
      </g>
    </g>
  </g>
</svg>
</template>
<main id="app" tabindex="-1" aria-live="polite"></main>
<div id="toast" role="status" aria-live="assertive"></div>
</body>
</html>
